[package]
name = "plots-windows"
version = "1.0.0-alpha.5"
edition = "2021"
license = "MIT"

[dependencies]
plots-core = { path = "../plots-core" }
plots-pdf = { path = "../plots-pdf" }
plots-print = { path = "../plots-print" }

[target.'cfg(windows)'.dependencies]
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }
windows = { version = "=0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security", "Win32_Storage_Xps", "Win32_System_EventLog", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
lopdf = "0.46.0"
