[package]
name = "plots-app"
version = "1.0.0-alpha.8"
edition = "2021"
license = "MIT"

[features]
# Liga as impressoras simuladas na lista. A compilacao do instalador desliga esta opcao.
default = ["simuladas"]
simuladas = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
plots-core = { path = "../plots-core" }
plots-info = { path = "../plots-info" }
plots-pdf = { path = "../plots-pdf" }
plots-perfis = { path = "../plots-perfis" }
plots-windows = { path = "../plots-windows" }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
toml = "=1.1.6"

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }
tiff = "=0.11.3"
