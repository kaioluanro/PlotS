<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title>How PlotS controls several printers</title>
  <desc>One PDF enters PlotS. The Rust core splits it into batches and computes a separate pass plan for each printer from a measured profile. Independent jobs run for a rear-feed inkjet, a bottom-tray laser and an automatic duplex printer, and all three deliver the same ordered stack. A bottom strip shows the manual duplex loop: front pass, wait for the spooler, flip and reload the stack, back pass, done.</desc>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#1d2129"/>
    </pattern>
    <radialGradient id="glow" cx="43%" cy="36%" r="58%">
      <stop offset="0" stop-color="#7fb4ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#7fb4ff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#7fb4ff"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#59616f"/>
    </marker>
  </defs>

  <rect width="1200" height="790" fill="#0b0c10"/>
  <rect width="1200" height="790" fill="url(#dots)"/>
  <rect width="1200" height="790" fill="url(#glow)"/>

  <!-- Header -->
  <text x="48" y="52" font-size="11" font-weight="600" letter-spacing="2.4" fill="#727b8c">PLOTS · WINDOWS</text>
  <text x="48" y="93" font-size="30" font-weight="600" fill="#f3f5f9">One document. Every printer. The same stack.</text>
  <text x="48" y="121" font-size="15" fill="#9aa3b4">Each printer gets its own pass order and rotation, computed from a measured profile — no driver changes.</text>

  <!-- Document card -->
  <rect x="48" y="150" width="208" height="386" rx="16" fill="#12141a" stroke="#272c36"/>
  <text x="68" y="180" font-size="10.5" font-weight="600" letter-spacing="2" fill="#727b8c">DOCUMENT</text>

  <path d="M68 202 h38 l18 18 v52 h-56 z" fill="#f4f4ef"/>
  <path d="M106 202 v18 h18 z" fill="#d7d7ce"/>
  <text x="96" y="252" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#14161c">PDF</text>

  <text x="68" y="308" font-size="15.5" font-weight="600" fill="#eef1f6">report.pdf</text>
  <text x="68" y="330" font-size="13" fill="#8b94a5">24 pages · A4</text>

  <rect x="68" y="360" width="168" height="30" rx="8" fill="#191c24" stroke="#2e3440"/>
  <text x="82" y="379" font-size="12.5" fill="#c9d0dc">No fixed batches</text>

  <line x1="68" y1="414" x2="236" y2="414" stroke="#242932"/>
  <text x="68" y="440" font-size="14" font-weight="600" fill="#eef1f6">One source</text>
  <text x="68" y="460" font-size="12.5" fill="#8b94a5">for every printer</text>
  <text x="68" y="486" font-size="12.5" fill="#8b94a5">Front and back are sent</text>
  <text x="68" y="503" font-size="12.5" fill="#8b94a5">as separate jobs.</text>

  <!-- Input arrow -->
  <line x1="260" y1="343" x2="286" y2="343" stroke="#7fb4ff" stroke-opacity="0.65" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- PlotS card -->
  <rect x="293" y="147" width="342" height="392" rx="20" fill="none" stroke="#7fb4ff" stroke-opacity="0.14"/>
  <rect x="296" y="150" width="336" height="386" rx="18" fill="#12141a" stroke="#3b4353"/>

  <text x="320" y="194" font-size="24" font-weight="700" fill="#f3f5f9">PlotS</text>
  <text x="320" y="214" font-size="12.5" fill="#8b94a5">Rust core · one plan per printer</text>
  <line x1="320" y1="228" x2="608" y2="228" stroke="#2a2f3a"/>

  <!-- Module 1 -->
  <rect x="316" y="242" width="296" height="78" rx="12" fill="#181b22" stroke="#2b303b"/>
  <rect x="332" y="258" width="26" height="26" rx="7" fill="#20242d" stroke="#323845"/>
  <path d="M338 265 h14 M338 271 h14 M338 277 h9" stroke="#8fb8f0" stroke-width="1.4" stroke-linecap="round"/>
  <text x="372" y="266" font-size="15" font-weight="600" fill="#eef1f6">Pass planner</text>
  <text x="372" y="286" font-size="12.3" fill="#8b94a5">Split into sheets; order and</text>
  <text x="372" y="302" font-size="12.3" fill="#8b94a5">rotate every page.</text>

  <!-- Module 2 -->
  <rect x="316" y="332" width="296" height="78" rx="12" fill="#181b22" stroke="#2b303b"/>
  <rect x="332" y="348" width="26" height="26" rx="7" fill="#20242d" stroke="#323845"/>
  <path d="M338 355 h14 M338 362 h14 M338 369 h14" stroke="#8fb8f0" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="341" cy="355" r="2" fill="#0b0c10" stroke="#8fb8f0" stroke-width="1.2"/>
  <circle cx="349" cy="362" r="2" fill="#0b0c10" stroke="#8fb8f0" stroke-width="1.2"/>
  <circle cx="344" cy="369" r="2" fill="#0b0c10" stroke="#8fb8f0" stroke-width="1.2"/>
  <text x="372" y="356" font-size="15" font-weight="600" fill="#eef1f6">Printer profiles</text>
  <text x="372" y="376" font-size="12.3" fill="#8b94a5">Order, rotation and reload gesture,</text>
  <text x="372" y="392" font-size="12.3" fill="#8b94a5">measured once per queue.</text>

  <!-- Module 3 -->
  <rect x="316" y="422" width="296" height="78" rx="12" fill="#181b22" stroke="#2b303b"/>
  <rect x="332" y="438" width="26" height="26" rx="7" fill="#20242d" stroke="#323845"/>
  <path d="M339 455 a6 6 0 1 1 3 5" fill="none" stroke="#8fb8f0" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M338 451 l1 4 4 -1" fill="none" stroke="#8fb8f0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="372" y="446" font-size="15" font-weight="600" fill="#eef1f6">Job engine</text>
  <text x="372" y="466" font-size="12.3" fill="#8b94a5">One state per printer; waits for</text>
  <text x="372" y="482" font-size="12.3" fill="#8b94a5">the spooler before the next pass.</text>

  <!-- Arrows from engine to printers -->
  <path d="M636 343 C 660 343 650 206 674 206" fill="none" stroke="#7fb4ff" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="636" y1="343" x2="674" y2="338" stroke="#7fb4ff" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M636 343 C 660 343 650 470 674 470" fill="none" stroke="#7fb4ff" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Printer lane 1 -->
  <rect x="680" y="150" width="472" height="112" rx="14" fill="#12141a" stroke="#272c36"/>
  <g stroke="#c8d0dd" stroke-width="1.6" fill="none">
    <rect x="700" y="180" width="34" height="16" rx="3"/>
    <rect x="704" y="170" width="26" height="10" rx="2" fill="#e8ebf1" stroke="none"/>
    <rect x="708" y="196" width="18" height="8" rx="1"/>
  </g>
  <circle cx="728" cy="188" r="1.3" fill="#7fb4ff"/>
  <text x="748" y="180" font-size="16.5" font-weight="600" fill="#eef1f6">Inkjet · rear feed</text>
  <text x="748" y="201" font-size="12.4" fill="#8b94a5">printed side up — flip the stack by its top edge</text>
  <rect x="928" y="166" width="116" height="24" rx="12" fill="#1b2430" stroke="#33506f"/>
  <text x="986" y="182" font-size="11.5" text-anchor="middle" fill="#9cc3ff">measured profile</text>
  <g>
    <rect x="1084" y="172" width="40" height="50" rx="2" fill="#c9c9c0"/>
    <rect x="1080" y="176" width="40" height="50" rx="2" fill="#e4e4da"/>
    <rect x="1076" y="180" width="40" height="50" rx="2" fill="#f7f7f0"/>
    <text x="1096" y="211" font-size="20" font-weight="700" text-anchor="middle" fill="#14161c">1</text>
  </g>
  <text x="1096" y="250" font-size="12.5" text-anchor="middle" fill="#8b94a5">1..N</text>

  <!-- Printer lane 2 -->
  <rect x="680" y="282" width="472" height="112" rx="14" fill="#12141a" stroke="#272c36"/>
  <g stroke="#c8d0dd" stroke-width="1.6" fill="none">
    <rect x="700" y="312" width="34" height="16" rx="3"/>
    <rect x="704" y="302" width="26" height="10" rx="2" fill="#e8ebf1" stroke="none"/>
    <rect x="708" y="328" width="18" height="8" rx="1"/>
  </g>
  <circle cx="728" cy="320" r="1.3" fill="#7fb4ff"/>
  <text x="748" y="312" font-size="16.5" font-weight="600" fill="#eef1f6">Laser · bottom tray</text>
  <text x="748" y="333" font-size="12.4" fill="#8b94a5">printed side down — reinsert the stack as it is</text>
  <rect x="928" y="298" width="116" height="24" rx="12" fill="#1b2430" stroke="#33506f"/>
  <text x="986" y="314" font-size="11.5" text-anchor="middle" fill="#9cc3ff">measured profile</text>
  <g>
    <rect x="1084" y="304" width="40" height="50" rx="2" fill="#c9c9c0"/>
    <rect x="1080" y="308" width="40" height="50" rx="2" fill="#e4e4da"/>
    <rect x="1076" y="312" width="40" height="50" rx="2" fill="#f7f7f0"/>
    <text x="1096" y="343" font-size="20" font-weight="700" text-anchor="middle" fill="#14161c">1</text>
  </g>
  <text x="1096" y="382" font-size="12.5" text-anchor="middle" fill="#8b94a5">1..N</text>

  <!-- Printer lane 3 -->
  <rect x="680" y="414" width="472" height="112" rx="14" fill="#12141a" stroke="#272c36"/>
  <g stroke="#c8d0dd" stroke-width="1.6" fill="none">
    <rect x="700" y="444" width="34" height="16" rx="3"/>
    <rect x="704" y="434" width="26" height="10" rx="2" fill="#e8ebf1" stroke="none"/>
    <rect x="708" y="460" width="18" height="8" rx="1"/>
  </g>
  <circle cx="728" cy="452" r="1.3" fill="#7fb4ff"/>
  <text x="748" y="444" font-size="16.5" font-weight="600" fill="#eef1f6">Duplex · automatic</text>
  <text x="748" y="465" font-size="12.4" fill="#8b94a5">both sides in one pass — no manual flip</text>
  <rect x="928" y="430" width="116" height="24" rx="12" fill="#1b2430" stroke="#33506f"/>
  <text x="986" y="446" font-size="11.5" text-anchor="middle" fill="#9cc3ff">automatic duplex</text>
  <g>
    <rect x="1084" y="436" width="40" height="50" rx="2" fill="#c9c9c0"/>
    <rect x="1080" y="440" width="40" height="50" rx="2" fill="#e4e4da"/>
    <rect x="1076" y="444" width="40" height="50" rx="2" fill="#f7f7f0"/>
    <text x="1096" y="475" font-size="20" font-weight="700" text-anchor="middle" fill="#14161c">1</text>
  </g>
  <text x="1096" y="514" font-size="12.5" text-anchor="middle" fill="#8b94a5">1..N</text>

  <!-- Manual duplex loop -->
  <rect x="48" y="566" width="1104" height="150" rx="16" fill="#101218" stroke="#242932"/>
  <text x="72" y="596" font-size="10.5" font-weight="600" letter-spacing="2" fill="#727b8c">THE MANUAL DUPLEX LOOP</text>

  <g>
    <circle cx="84" cy="626" r="11" fill="#1b2430" stroke="#33506f"/>
    <text x="84" y="630" font-size="11" font-weight="600" text-anchor="middle" fill="#9cc3ff">1</text>
    <text x="106" y="632" font-size="14.5" font-weight="600" fill="#eef1f6">Front</text>
    <text x="106" y="652" font-size="12.2" fill="#8b94a5">send the chosen face</text>

    <line x1="232" y1="626" x2="270" y2="626" stroke="#59616f" stroke-width="1.4" marker-end="url(#arrow-dim)"/>

    <circle cx="298" cy="626" r="11" fill="#1b2430" stroke="#33506f"/>
    <text x="298" y="630" font-size="11" font-weight="600" text-anchor="middle" fill="#9cc3ff">2</text>
    <text x="320" y="632" font-size="14.5" font-weight="600" fill="#eef1f6">Wait</text>
    <text x="320" y="652" font-size="12.2" fill="#8b94a5">the spooler confirms</text>

    <line x1="446" y1="626" x2="484" y2="626" stroke="#59616f" stroke-width="1.4" marker-end="url(#arrow-dim)"/>

    <circle cx="512" cy="626" r="11" fill="#1b2430" stroke="#33506f"/>
    <text x="512" y="630" font-size="11" font-weight="600" text-anchor="middle" fill="#9cc3ff">3</text>
    <text x="534" y="632" font-size="14.5" font-weight="600" fill="#eef1f6">Flip and reload</text>
    <text x="534" y="652" font-size="12.2" fill="#8b94a5">follow the card</text>

    <line x1="660" y1="626" x2="698" y2="626" stroke="#59616f" stroke-width="1.4" marker-end="url(#arrow-dim)"/>

    <circle cx="726" cy="626" r="11" fill="#1b2430" stroke="#33506f"/>
    <text x="726" y="630" font-size="11" font-weight="600" text-anchor="middle" fill="#9cc3ff">4</text>
    <text x="748" y="632" font-size="14.5" font-weight="600" fill="#eef1f6">Back</text>
    <text x="748" y="652" font-size="12.2" fill="#8b94a5">send the other face</text>

    <line x1="874" y1="626" x2="912" y2="626" stroke="#59616f" stroke-width="1.4" marker-end="url(#arrow-dim)"/>

    <circle cx="940" cy="626" r="11" fill="#1b2430" stroke="#33506f"/>
    <text x="940" y="630" font-size="11" font-weight="600" text-anchor="middle" fill="#9cc3ff">5</text>
    <text x="962" y="632" font-size="14.5" font-weight="600" fill="#eef1f6">Done</text>
    <text x="962" y="652" font-size="12.2" fill="#8b94a5">the stack reads 1..N</text>
  </g>

  <text x="72" y="692" font-size="12.2" fill="#6f788a">Mixed paper runs in one section per size. If a sheet jams or the stack is wrong, reprint only that run.</text>

  <!-- Footer -->
  <text x="48" y="752" font-size="11.5" fill="#6f788a">github.com/kaioluanro/PlotS</text>
  <text x="1152" y="752" font-size="11.5" text-anchor="end" fill="#6f788a">MIT · Windows · 1.0.0-alpha.8</text>
</svg>
